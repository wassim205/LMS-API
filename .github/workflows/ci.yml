name: CI

on:
  push:
    branches:
      - preprod
  pull_request:
    branches:
      - preprod

jobs:
  api:
    name: API - Lint / E2E / Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/api

      - name: Lint
        run: npm run lint
        working-directory: apps/api

      - name: Cache MongoDB binary (MongoMemoryServer)
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-memory-server-7.0.14-linux

      - name: E2E tests
        run: npm run test:e2e
        working-directory: apps/api
        env:
          NODE_ENV: test
          MONGOMS_VERSION: "7.0.14"

      - name: Build
        run: npm run build
        working-directory: apps/api

  web:
    name: Web - Lint / Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/web

      - name: Lint
        run: pnpm lint
        working-directory: apps/web

      - name: Build
        run: pnpm build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
